<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">InputMore input enhancement flow</title>
  <desc id="desc">Voice, text, and selection enter InputMore and become ready-to-use output in any app.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#242321"/><stop offset="1" stop-color="#514c44"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#f1dfc2"/><stop offset="1" stop-color="#c9a879"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".22"/></filter>
  </defs>
  <rect width="1400" height="760" rx="32" fill="url(#bg)"/>
  <circle cx="1220" cy="100" r="180" fill="#e7d4b3" opacity=".08"/>
  <circle cx="180" cy="690" r="230" fill="#e7d4b3" opacity=".06"/>
  <g fill="#f7f2e9" font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="80" y="100" font-size="24" letter-spacing="5" fill="#d6c5aa">INPUTMORE</text>
    <text x="80" y="180" font-size="58" font-weight="700">More power for every input.</text>
    <text x="80" y="225" font-size="23" fill="#ded5c8">Turn voice, text, and selected content into something ready to use.</text>
  </g>
  <g filter="url(#shadow)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="80" y="330" width="300" height="190" rx="22" fill="#f4efe7"/>
    <text x="115" y="380" font-size="18" fill="#8a8175" letter-spacing="2">INPUT</text>
    <text x="115" y="432" font-size="30" font-weight="700" fill="#3d3934">Voice · Text · Selection</text>
    <text x="115" y="476" font-size="17" fill="#6e675e">Your words, in your workflow</text>
    <rect x="550" y="285" width="300" height="280" rx="28" fill="#6e675e" stroke="#e7d4b3" stroke-opacity=".6"/>
    <text x="600" y="345" font-size="18" fill="#e7d4b3" letter-spacing="2">INPUTMORE</text>
    <text x="600" y="405" font-size="34" font-weight="700" fill="#fffaf2">AI input layer</text>
    <text x="600" y="452" font-size="19" fill="#f0e7d9">Enhance · Translate · Ask</text>
    <rect x="600" y="490" width="200" height="3" rx="2" fill="url(#accent)"/>
    <rect x="1020" y="330" width="300" height="190" rx="22" fill="#f4efe7"/>
    <text x="1055" y="380" font-size="18" fill="#8a8175" letter-spacing="2">OUTPUT</text>
    <text x="1055" y="432" font-size="30" font-weight="700" fill="#3d3934">Ready-to-use text</text>
    <text x="1055" y="476" font-size="17" fill="#6e675e">Preview · Copy · Write back</text>
  </g>
  <g fill="none" stroke="#e7d4b3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M390 425h130"/><path d="m490 397 30 28-30 28"/>
    <path d="M860 425h130"/><path d="m960 397 30 28-30 28"/>
  </g>
  <text x="80" y="675" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" fill="#d6c5aa">The lightweight AI input layer for every app.</text>
</svg>
