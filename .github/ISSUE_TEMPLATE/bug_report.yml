name: Bug report
description: Report a reproducible problem in InputMore
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove API keys, private text, and authorization headers before submitting.
  - type: input
    id: version
    attributes:
      label: InputMore version
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: provider
    attributes:
      label: Provider context
      description: Provider and model names only; never include API keys.
