[package]
name = "inputmore"
version = "0.1.0"
description = "Model-agnostic desktop AI input layer"
authors = ["InputMore"]
edition = "2021"

[lib]
name = "inputmore_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.3", features = [] }

[dependencies]
tauri = { version = "2.6", features = [] }
tauri-plugin-opener = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
